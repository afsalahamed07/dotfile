set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'


set-option -sa terminal-overrides ",xterm*:Tc"
set -sg escape-time 0
set -g history-limit 200000
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1

# :theme
source-file ~/.config/tmux/themes/current.conf

set -g mouse on

unbind p
bind -n C-h previous-window

unbind n
bind -n C-l next-window

bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"


# Enable Vim key bindings in copy mode
set -g mode-keys vi

# Set copy mode key binding (Ctrl+b [ to enter copy mode)
bind-key -T copy-mode-vi v send -X begin-selection # Start selection with 'v'
bind-key -T copy-mode-vi y send -X copy-selection  # Yank/copy with 'y'

bind-key -n C-S-o display-popup -w 80% -h 80% -E "~/.config/tmux/plugins/tmux-session/tmux-fzf.sh"

set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm' 
